<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>nixen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="site-shell">
    <!-- Intentionally blank for now.
         Later, your main-site navigation/header can go here. -->

    <section class="toolbar" aria-label="List controls">
      <div class="search-wrap">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
        </svg>
        <input
          id="searchInput"
          type="search"
          placeholder="Search levels"
          autocomplete="off"
          aria-label="Search levels"
        />
      </div>

      <div class="results-text" id="resultsText"></div>
    </section>

    <section id="levelList" class="level-list" aria-live="polite"></section>

    <div id="emptyState" class="empty-state" hidden>
      <p>No levels found.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
